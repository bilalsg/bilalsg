<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Terminal Portfolio</title>
<style>
  html,body{margin:0;padding:0;background:#010409;display:flex;align-items:center;justify-content:center;min-height:100vh;}

  .terminal{
    width:860px;
    height:480px;
    border-radius:12px;
    overflow:hidden;
    background:linear-gradient(180deg,#0d1117 0%,#010409 100%);
    border:1px solid #30363d;
    box-shadow:0 30px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.02);
    font-family:'Fira Code','JetBrains Mono',Consolas,monospace;
    position:relative;
  }

  .titlebar{
    height:42px;
    background:#161b22;
    border-bottom:1px solid #30363d;
    display:flex;
    align-items:center;
    padding:0 16px;
    position:relative;
    z-index:5;
  }
  .dot{width:12px;height:12px;border-radius:50%;margin-right:8px;}
  .dot.red{background:#ff5f56;} .dot.yellow{background:#ffbd2e;} .dot.green{background:#27c93f;}
  .titlebar .label{
    position:absolute;left:50%;transform:translateX(-50%);
    color:#8b949e;font-size:12.5px;
  }

  .screen{
    position:relative;
    height:calc(100% - 42px);
    overflow:hidden;
  }

  /* ---------- matrix rain ---------- */
  .rain{
    position:absolute;inset:0;
    filter:blur(.3px);
    opacity:.85;
    mix-blend-mode:screen;
  }
  .col{
    position:absolute;
    top:-200px;
    font-size:14px;
    line-height:18px;
    color:#3fb950;
    opacity:.34;
    text-shadow:0 0 6px rgba(63,185,80,.5);
    animation:fall linear infinite;
    white-space:pre;
  }
  @keyframes fall{
    from{transform:translateY(0);}
    to{transform:translateY(680px);}
  }

  .scanlines{
    position:absolute;inset:0;
    background:repeating-linear-gradient(
      to bottom, rgba(0,0,0,.08) 0px, rgba(0,0,0,.08) 1px,
      transparent 1px, transparent 3px
    );
    pointer-events:none;
    z-index:4;
  }
  .vignette{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(0,0,0,.5) 100%);
    pointer-events:none;
    z-index:6;
  }
  .flicker{
    position:absolute;inset:0;
    background:#7ee787;
    opacity:0;
    pointer-events:none;
    z-index:3;
    animation:flicker 6.3s ease-in-out infinite;
  }
  @keyframes flicker{
    0%,100%{opacity:0;} 42%{opacity:0;} 43%{opacity:.02;} 44%{opacity:0;}
    71%{opacity:0;} 71.5%{opacity:.025;} 72%{opacity:0;}
  }

  /* ---------- content ---------- */
  .content{
    position:relative;z-index:5;
    padding:26px 32px;
    animation:cycleFade 15s ease-in-out infinite;
  }
  @keyframes cycleFade{
    0%{opacity:1;}
    94%{opacity:1;}
    97.5%{opacity:0;}
    100%{opacity:0;}
  }

  .row{
    font-size:14.5px;
    line-height:24px;
    white-space:nowrap;
    overflow:hidden;
  }
  .cmd{color:#7ee787;text-shadow:0 0 5px rgba(126,231,135,.35);}
  .out{color:#79c0ff;text-shadow:0 0 5px rgba(121,192,255,.3);}
  .dim{color:#8b949e;}
  .ok{color:#3fb950;}
  .warn{color:#f85149;}
  .succ{color:#7ee787;}

  .typewrap{display:inline-block;}
  .clip{
    display:inline-block;
    animation-timing-function: steps(28,end);
    animation-fill-mode: both;
    animation-iteration-count: infinite;
    animation-duration: 15s;
  }

  /* individual reveal windows (percent of 15s loop) */
  .l1{ clip-path:inset(0 100% 0 0); animation-name: r1; }
  @keyframes r1{ 0%,2%{clip-path:inset(0 100% 0 0);} 4.5%,100%{clip-path:inset(0 0 0 0);} }

  .l2{ clip-path:inset(0 100% 0 0); animation-name: r2; }
  @keyframes r2{ 0%,6.5%{clip-path:inset(0 100% 0 0);} 10.5%,100%{clip-path:inset(0 0 0 0);} }

  .l3{ clip-path:inset(0 100% 0 0); animation-name: r3; }
  @keyframes r3{ 0%,13%{clip-path:inset(0 100% 0 0);} 18%,100%{clip-path:inset(0 0 0 0);} }

  .l4{ clip-path:inset(0 100% 0 0); animation-name: r4; }
  @keyframes r4{ 0%,20%{clip-path:inset(0 100% 0 0);} 31.5%,100%{clip-path:inset(0 0 0 0);} }

  .l5{ clip-path:inset(0 100% 0 0); animation-name: r5; }
  @keyframes r5{ 0%,35%{clip-path:inset(0 100% 0 0);} 42.5%,100%{clip-path:inset(0 0 0 0);} }

  .l6{ clip-path:inset(0 100% 0 0); animation-name: r6; }
  @keyframes r6{ 0%,57%{clip-path:inset(0 100% 0 0);} 61%,100%{clip-path:inset(0 0 0 0);} }

  .l7{ clip-path:inset(0 100% 0 0); animation-name: r7; }
  @keyframes r7{ 0%,63%{clip-path:inset(0 100% 0 0);} 73%,100%{clip-path:inset(0 0 0 0);} }

  .l8{ clip-path:inset(0 100% 0 0); animation-name: r8; }
  @keyframes r8{ 0%,75%{clip-path:inset(0 100% 0 0);} 79%,100%{clip-path:inset(0 0 0 0);} }

  .l9{ clip-path:inset(0 100% 0 0); animation-name: r9; }
  @keyframes r9{ 0%,86.5%{clip-path:inset(0 100% 0 0);} 90.5%,100%{clip-path:inset(0 0 0 0);} }

  /* simple fade-in rows (spinner output / status lines) */
  .fadein{ opacity:0; animation-timing-function:ease; animation-fill-mode:both;
            animation-iteration-count:infinite; animation-duration:15s; }

  .spin  { animation-name:f-spin; }
  @keyframes f-spin{ 0%,44%{opacity:0;} 45%,50.5%{opacity:1;} 51%,100%{opacity:0;} }

  .bar-track{ animation-name:f-spin; }
  .bar-fill{
    height:8px;border-radius:4px;
    background:linear-gradient(90deg,#238636,#7ee787);
    animation-name:barfill; animation-timing-function:linear; animation-fill-mode:both;
    animation-iteration-count:infinite; animation-duration:15s;
    width:0;
  }
  @keyframes barfill{ 0%,44%{width:0%;} 52%{width:100%;} 53%,100%{width:100%;} }

  .succ-line{ animation-name:f-succ; }
  @keyframes f-succ{ 0%,53%{opacity:0;} 55%,100%{opacity:1;} 94%{opacity:1;} }
  /* succ-line stays visible after appearing, resets with global cycleFade */

  .diagh{ animation-name:f-diagh; }
  @keyframes f-diagh{ 0%,80.5%{opacity:0;} 81.5%,100%{opacity:1;} }

  .diag1{ animation-name:f-diag1; }
  @keyframes f-diag1{ 0%,82%{opacity:0;} 83%,100%{opacity:1;} }
  .diag2{ animation-name:f-diag2; }
  @keyframes f-diag2{ 0%,83.5%{opacity:0;} 84.5%,100%{opacity:1;} }
  .diag3{ animation-name:f-diag3; }
  @keyframes f-diag3{ 0%,85%{opacity:0;} 86%,100%{opacity:1;} }

  .cursor{
    display:inline-block;width:8px;height:16px;
    background:#7ee787;margin-left:2px;vertical-align:-2px;
    opacity:0; animation-fill-mode:both;
    animation-name:cursorwin, cursorblink;
    animation-duration:15s, .9s;
    animation-iteration-count:infinite, infinite;
    animation-timing-function:step-end, step-end;
  }
  @keyframes cursorwin{ 0%,90%{opacity:0;} 90.6%,100%{opacity:1;} }
  @keyframes cursorblink{ 0%,50%{opacity:1;} 50.01%,100%{opacity:0;} }
</style>
</head>
<body>

<div class="terminal">
  <div class="titlebar">
    <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
    <div class="label">bilal@estin: ~/portfolio</div>
  </div>

  <div class="screen">
    <div class="rain" id="rain"></div>
    <div class="scanlines"></div>
    <div class="flicker"></div>

    <div class="content">
      <div class="row"><span class="cmd clip l1">$ whoami</span></div>
      <div class="row"><span class="out clip l2">&gt; bilal-segaa</span></div>

      <div class="row" style="margin-top:6px"><span class="cmd clip l3">$ cat role.txt</span></div>
      <div class="row"><span class="out clip l4">&gt; Data Scientist · Full-Stack Developer · AI Enthusiast</span></div>

      <div class="row" style="margin-top:6px"><span class="cmd clip l5">$ npm install creativity --save</span></div>
      <div class="row fadein spin dim">⠋ Resolving packages...</div>
      <div class="row" style="margin:4px 0 8px">
        <div class="bar-track" style="width:420px;height:8px;border-radius:4px;background:#21262d;border:1px solid #30363d;">
          <div class="bar-fill"></div>
        </div>
      </div>
      <div class="row fadein succ-line succ">✓ Package "creativity" installed successfully</div>

      <div class="row" style="margin-top:8px"><span class="cmd clip l6">$ cat education.txt</span></div>
      <div class="row"><span class="out clip l7">&gt; CS Engineering @ ESTIN — AI &amp; Data Science track</span></div>

      <div class="row" style="margin-top:8px"><span class="cmd clip l8">$ ./status.sh</span></div>
      <div class="row fadein diagh dim">Running diagnostics...</div>
      <div class="row fadein diag1"><span class="ok">[✓]</span> <span class="dim">Passion&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;: </span><span class="succ">online</span></div>
      <div class="row fadein diag2"><span class="ok">[✓]</span> <span class="dim">Curiosity&nbsp;&nbsp;&nbsp;: </span><span class="succ">online</span></div>
      <div class="row fadein diag3"><span class="ok">[✓]</span> <span class="dim">Coffee level: </span><span class="warn">critical</span></div>

      <div class="row" style="margin-top:8px">
        <span class="out clip l9">&gt; Open to collaboration ✓ building intelligent apps</span><span class="cursor"></span>
      </div>
    </div>

    <div class="vignette"></div>
  </div>
</div>

<script>
  // build matrix rain columns once, purely decorative / CSS-driven afterwards
  const chars = "アイウエオカキクケコサシスセソ0123456789#$%&*+".split("");
  const rain = document.getElementById('rain');
  const colCount = 22;
  for(let i=0;i<colCount;i++){
    const col = document.createElement('div');
    col.className = 'col';
    col.style.left = (i * (860/colCount) + Math.random()*10) + 'px';
    const len = 14 + Math.floor(Math.random()*10);
    let txt = '';
    for(let j=0;j<len;j++){ txt += chars[Math.floor(Math.random()*chars.length)] + '\n'; }
    col.textContent = txt;
    col.style.animationDuration = (5 + Math.random()*5).toFixed(2) + 's';
    col.style.animationDelay = (-Math.random()*10).toFixed(2) + 's';
    col.style.opacity = (0.18 + Math.random()*0.22).toFixed(2);
    rain.appendChild(col);
  }
</script>

</body>
</html>
